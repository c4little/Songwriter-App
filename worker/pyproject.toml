[project]
name = "songwriter-worker"
version = "0.0.0"
description = "Audio processing and PDF rendering for the Songwriter app (runs on Modal)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "modal>=1.6",
    # Required by Modal web endpoints.
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    # Used only by tests to call the FastAPI app in-process.
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
